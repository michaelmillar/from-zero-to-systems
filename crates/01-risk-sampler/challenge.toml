# ── Haskell ─────────────────────────────────────────────────────────────────

[haskell]
concepts = [
    "Threading RNG state through folds (no mutation)",
    "Algebraic data types for RiskEvent and SimulationResult",
    "Strict accumulation to avoid space leaks from laziness",
    "Data.List.sort for the VaR percentile calculation",
]

[[haskell.docs]]
label = "System.Random"
url   = "https://hackage.haskell.org/package/random/docs/System-Random.html"

[[haskell.docs]]
label = "Data.List.sort"
url   = "https://hackage.haskell.org/package/base/docs/Data-List.html#v:sort"

[[haskell.hints]]
test_name = "zero_probability"
hints = [
    "Use `mkStdGen seed` then thread the generator through a fold over trials.",
    "Each `randomR (0.0, 1.0) gen` call returns (value, newGen). Chain the new generator.",
]

[[haskell.tools]]
name = "hspec"
url  = "https://hspec.github.io"
description = "BDD-style testing framework for Haskell."

[[haskell.tools]]
name = "criterion"
url  = "https://hackage.haskell.org/package/criterion"
description = "Statistical benchmarking library for Haskell."

[[haskell.tools]]
name = "hlint"
url  = "https://github.com/ndmitchell/hlint"
description = "Linter suggesting idiomatic Haskell improvements."

# ── Comparison ──────────────────────────────────────────────────────────────

[comparison]
summary = "Risk-sampler demonstrates how four languages handle the same Monte Carlo simulation with very different performance and safety trade-offs."

[[comparison.trade_offs]]
dimension = "Performance"
rust    = "Compiled, zero-cost abstractions, ~10x faster than Python. Comparable to C with bounds checking."
c       = "Fastest raw throughput, but no bounds checking means buffer overflows are silent."
python  = "Interpreted, ~50-100x slower than compiled languages. NumPy can close the gap for vectorised work."
haskell = "Compiled with -O2 comparable to Rust/C for numeric code, but lazy evaluation can cause unexpected allocations."

[[comparison.trade_offs]]
dimension = "Memory safety"
rust    = "Ownership system prevents use-after-free, double-free, and data races at compile time."
c       = "No safety net. Manual malloc/free. Valgrind and ASan catch errors at runtime, not compile time."
python  = "Garbage collected. Memory safety is not a concern but reference cycles can leak."
haskell = "Garbage collected with no mutable state by default. Thunk accumulation is the main footgun."

[[comparison.trade_offs]]
dimension = "Expressiveness"
rust    = "Generics, traits, pattern matching, iterators. Verbose lifetime annotations for complex borrowing."
c       = "Minimal abstraction. No generics, no closures, no pattern matching. Everything is explicit."
python  = "Most concise. Dataclasses, list comprehensions, dynamic typing makes prototyping fast."
haskell = "Algebraic types, pattern matching, higher-order functions. Steep learning curve but very expressive."

[[comparison.trade_offs]]
dimension = "Ecosystem"
rust    = "cargo + crates.io. Strong testing, benchmarking (criterion), and profiling (flamegraph) tooling."
c       = "Make + system packages. Mature but fragmented. Valgrind, gdb, and sanitisers for debugging."
python  = "pip + PyPI. Largest ecosystem for data science. pytest, mypy, cProfile readily available."
haskell = "cabal + Hackage. Smaller ecosystem but high-quality libraries. criterion, hspec, hlint."
