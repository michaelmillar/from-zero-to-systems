[challenge]
package = "risk-sampler"
display = "01 · risk-sampler"

[shared]
intro = "Simulate risk events across thousands of trials to calculate Value at Risk (VaR). Each trial rolls random events and accumulates losses; the 95th-percentile trial loss is your VaR 95 -- the figure used by banks and insurers to size capital reserves."
concepts = [
    "Monte Carlo simulation",
    "Loss distribution sampling",
    "Value at Risk (VaR) -- 95th percentile",
    "Seeded deterministic RNG",
]

[[shared.docs]]
label = "Monte Carlo method"
url   = "https://en.wikipedia.org/wiki/Monte_Carlo_method"

[[shared.hints]]
test_name = "zero_probability"
hints = [
    "Start with a seeded RNG and loop over trials. Inside each trial, iterate over events and check if each fires.",
    "An event with probability 0.0 never fires, so occurrences and total_loss stay at zero.",
    "Return a result struct with all zero loss fields and var_95 = 0.0.",
]

[[shared.hints]]
test_name = "certain_event"
hints = [
    "Inside the event-fires branch: increment occurrences and sample a loss uniformly in [0, max_loss).",
    "Accumulate the trial total and running total separately.",
    "With probability=1.0, occurrences == trials and total_loss > 0.",
]

[[shared.hints]]
test_name = "var_95"
hints = [
    "Collect each trial's total loss into a Vec.",
    "Sort the Vec (f64 needs partial_cmp, not cmp).",
    "VaR 95 = losses[(0.95 * trials) as usize]. It must be <= the max possible single-event loss.",
]

[[shared.hints]]
test_name = "mean_loss"
hints = [
    "Track the max observed single-trial loss across all trials.",
    "mean_loss_per_trial = total_loss / trials (divide by ALL trials, not just those where the event fired).",
    "With 500k trials the mean converges to prob * max_loss / 2.0 within 5%.",
]

# ── Rust ────────────────────────────────────────────────────────────────────

[rust]
concepts = [
    "rand::SeedableRng for deterministic seeding",
    "Vec::sort_by with partial_cmp for f64 sorting",
    "Iterator combinators vs explicit loops",
]

[[rust.docs]]
label = "rand::SeedableRng"
url   = "https://docs.rs/rand/latest/rand/trait.SeedableRng.html"

[[rust.docs]]
label = "Vec::sort_by"
url   = "https://doc.rust-lang.org/std/vec/struct.Vec.html#method.sort_by"

[[rust.hints]]
test_name = "zero_probability"
hints = [
    "`let mut rng = StdRng::seed_from_u64(seed);` then `for _ in 0..trials { }`.",
    "`if rng.gen::<f64>() < event.probability { /* fires */ }` -- with probability=0.0 this is never true.",
]

[[rust.hints]]
test_name = "var_95"
hints = [
    "`trial_losses.sort_by(|a, b| a.partial_cmp(b).unwrap());` -- f64 does not implement Ord.",
]

[[rust.tools]]
name = "cargo-flamegraph"
url  = "https://github.com/flamegraph-rs/flamegraph"
description = "Generate flamegraphs from cargo benchmarks to find hot loops."

[[rust.tools]]
name = "criterion"
url  = "https://docs.rs/criterion/latest/criterion/"
description = "Statistical benchmarking framework for Rust."

# ── C ───────────────────────────────────────────────────────────────────────

[c]
concepts = [
    "Manual malloc/free for dynamic arrays",
    "Function pointers for qsort comparator",
    "rand_r with seed state for thread-safe seeded RNG",
    "No generics: concrete types everywhere",
]

[[c.docs]]
label = "qsort(3)"
url   = "https://man7.org/linux/man-pages/man3/qsort.3.html"

[[c.docs]]
label = "rand_r(3)"
url   = "https://man7.org/linux/man-pages/man3/rand_r.3.html"

[[c.hints]]
test_name = "zero_probability"
hints = [
    "Use `unsigned int state = (unsigned int)seed;` and `rand_r(&state)` for repeatable randomness.",
    "Cast `rand_r(&state) / (double)RAND_MAX` to get a uniform [0,1) value.",
]

[[c.tools]]
name = "Valgrind"
url  = "https://valgrind.org"
description = "Detect memory leaks, use-after-free, and uninitialised reads."

[[c.tools]]
name = "AddressSanitiser"
url  = "https://clang.llvm.org/docs/AddressSanitizer.html"
description = "Compile with -fsanitize=address for fast memory error detection."

[[c.tools]]
name = "gdb"
url  = "https://sourceware.org/gdb/"
description = "Step through C code, inspect memory, and set breakpoints."

# ── Python ──────────────────────────────────────────────────────────────────

[python]
concepts = [
    "dataclasses for structured data",
    "random.Random(seed) for deterministic seeding",
    "List comprehensions and sorted()",
    "Type hints for documentation and mypy checking",
]

[[python.docs]]
label = "random.Random"
