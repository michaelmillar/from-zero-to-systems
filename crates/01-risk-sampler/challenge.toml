[[python.docs]]
label = "dataclasses"
url   = "https://docs.python.org/3/library/dataclasses.html"

[[python.hints]]
test_name = "zero_probability"
hints = [
    "`rng = random.Random(seed)` then `rng.random()` for each check.",
    "With probability=0.0, `rng.random() < 0.0` is always False.",
]

[[python.tools]]
name = "pytest"
url  = "https://docs.pytest.org"
description = "The standard Python testing framework with fixtures and parametrise."

[[python.tools]]
name = "mypy"
